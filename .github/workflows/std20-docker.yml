name: GitOps DOCKER CICD Pipeline

on:
  push:
    branches:
      - main

# 2. 작업 정의
jobs:
  build-and-update:
    runs-on: ubuntu-latest    # 실제 작업 주체
    steps:
      - name: 소스 코드 전송
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/nginx:1.31.3-cd

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Docker 컨테이너 배포 및 S3 동기화
        run: |
          # S3 버킷으로 HTML 파일 동기화
          aws ssm send-command \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters  "commands =[
              \"docker stop nginx_container || true\",
              \"docker rm nginx_container || true\",
              \"docker run -d --name nginx_container -p 80:80 nginx:1.31.3-alpine\"
            ]" \
            --region "${{ secrets.AWS_REGION }}" \
            --comment "Deploy nginx Docker container and sync S3 bucket to nginx html directory"